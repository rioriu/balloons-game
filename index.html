<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>ふうせんポン</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app" aria-live="polite">
      <section id="start-screen" class="screen active" aria-label="スタート画面">
        <h1>ふうせんポン</h1>
        <p class="subtitle">ふうせんをタップして、たくさん点をとろう！</p>
        <ul class="rule-list">
          <li><span class="dot red"></span>あか：1てん</li>
          <li><span class="dot blue"></span>あお：2てん</li>
          <li><span class="dot gold"></span>きん：5てん</li>
          <li><span class="dot black"></span>くろ：-1てん</li>
        </ul>
        <p class="bird-hint">ときどき とりが とんでくるよ！<br />とりが わると 0てん。さきに タップしよう！</p>
        <label class="sound-toggle">
          <input id="sound-checkbox" type="checkbox" />
          おとをならす
        </label>
        <button id="start-button" class="primary">スタート</button>
      </section>

      <section id="play-screen" class="screen" aria-label="プレイ画面">
        <header class="hud">
          <p>のこり: <span id="time-value">30</span>びょう</p>
          <p>スコア: <span id="score-value">0</span></p>
        </header>
        <canvas id="game-canvas" aria-label="ゲームキャンバス"></canvas>
      </section>

      <section id="result-screen" class="screen" aria-label="結果画面">
        <h2>おしまい！</h2>
        <p class="result-score">さいしゅうスコア: <strong id="final-score">0</strong></p>
        <p id="result-message"></p>
        <button id="retry-button" class="primary">もういちど</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
